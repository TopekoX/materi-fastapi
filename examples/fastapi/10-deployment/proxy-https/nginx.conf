# Konfigurasi Nginx sebagai reverse proxy HTTPS di depan TugasKU API.
# Sertifikat contoh (self-signed) ada di folder certs/ dan hanya untuk percobaan lokal.

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        # "api" adalah nama layanan di docker-compose.yml
        proxy_pass http://api:8000;

        # Teruskan identitas request asli ke aplikasi
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
